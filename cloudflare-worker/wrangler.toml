name = "orbitreach-agent"
main = "src/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health", "/ready"]

[observability]
enabled = true

[vars]
AI_MODEL = "@cf/meta/llama-3.1-8b-instruct"
DEFAULT_TASK_BUDGET_USD = "0.25"
MAX_OUTPUT_TOKENS = "1200"
MAX_WORKFLOW_STEPS = "30"
MAX_RETRIES = "3"
MAX_FETCH_BYTES = "120000"
MAX_STEP_MS = "25000"
MAX_TASK_BUDGET_USD = "1"
EST_COST_PER_1K_TOKENS_USD = "0.002"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "orbitreach"
database_id = "0e3d7ccb-6d90-46ec-8095-59c9fb3be80a"

[[r2_buckets]]
binding = "R2"
bucket_name = "orbitreach-data"

[[queues.producers]]
binding = "AGENT_QUEUE"
queue = "orbitreach-agent-jobs"

[[queues.consumers]]
queue = "orbitreach-agent-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[[workflows]]
name = "orbitreach-agent-workflow"
binding = "ORBIT_WORKFLOW"
class_name = "OrbitReachWorkflow"

[triggers]
crons = ["*/5 * * * *"]

# Secrets: set with `wrangler secret put` — never put values here.
# ADMIN_TOKEN
# SESSION_SECRET
# WEBHOOK_SECRET
